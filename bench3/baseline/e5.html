<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0}
  body{width:1200px;height:1800px;position:relative;overflow:hidden;background:#F2EDE3;color:#1D3F73;font-family:Pretendard}
  .paper{position:absolute;inset:0;background:
    radial-gradient(1200px 900px at 20% 0%, rgba(255,255,255,.55), transparent 60%),
    linear-gradient(#F3EEE4,#EEE7DA)}
  .top{position:absolute;left:110px;right:110px;top:110px;display:flex;justify-content:space-between;font-size:24px;letter-spacing:.3em;color:#1D3F73}
  .top .r{font-family:'Cormorant Garamond';font-style:italic;letter-spacing:.04em;font-size:28px;color:#6E86A8}
  .title{position:absolute;left:96px;top:250px;font-family:'NanumMyeongjo';font-weight:800;font-size:252px;line-height:1.08;letter-spacing:-.06em}
  .title div{white-space:nowrap}
  .t1{color:#1D3F73}
  .t2{color:#5F82B0}
  .t3{color:#A6BBD3}
  .dot{color:#E2713F}
  .sea{position:absolute;left:0;right:0;top:1236px;bottom:0;background:linear-gradient(#C9D7E4,#DDE5EA 60%,#E9ECEA)}
  .horizon{position:absolute;left:0;right:0;top:1236px;height:3px;background:#1D3F73}
  .sun{position:absolute;left:820px;top:1112px;width:248px;height:124px;overflow:hidden}
  .sun i{display:block;width:248px;height:248px;border-radius:50%;background:#E2713F}
  .glint{position:absolute;left:820px;top:1256px;width:248px}
  .glint b{display:block;height:4px;background:#E2713F;margin:0 auto 14px;border-radius:2px;opacity:.75}
  .vert{position:absolute;right:112px;top:262px;writing-mode:vertical-rl;font-family:'Cormorant Garamond';font-style:italic;font-size:30px;letter-spacing:.08em;color:#6E86A8}
  .author{position:absolute;left:110px;top:1340px;font-family:'NanumMyeongjo';font-weight:700;font-size:58px;letter-spacing:.32em;color:#1D3F73}
  .author small{display:block;font-family:Pretendard;font-weight:500;font-size:22px;letter-spacing:.4em;color:#4F6E98;margin-bottom:22px}
  .quote{position:absolute;left:110px;top:1500px;width:620px;font-family:'Gowun Batang';font-size:25px;line-height:1.75;color:#3D5B85}
  .pub{position:absolute;right:110px;bottom:104px;display:flex;align-items:center;gap:14px;font-family:'NanumMyeongjo';font-weight:800;font-size:32px;letter-spacing:.12em;color:#1D3F73}
  .pub svg{display:block}
</style></head>
<body>
<div class="paper"></div>
<div class="sea"></div>
<div class="sun"><i></i></div>
<div class="glint"><b style="width:200px"></b><b style="width:140px"></b><b style="width:90px;opacity:.5"></b><b style="width:46px;opacity:.35"></b></div>
<div class="horizon"></div>

<div class="top"><span>윤서해 장편소설</span><span class="r">a novel</span></div>
<div class="title">
  <div class="t1">여름의</div>
  <div class="t2">끝에서</div>
  <div class="t3">우리는<span class="dot">.</span></div>
</div>
<div class="vert">At the End of Summer, We</div>

<div class="author"><small>지은이</small>윤서해</div>
<div class="quote">해가 수평선에 닿기까지 남은 시간은<br>우리가 서로에게 남겨 둔 말의 길이와 같았다.</div>
<div class="pub">
  <svg width="40" height="40" viewBox="0 0 40 40"><rect width="40" height="40" rx="4" fill="#1D3F73"/><path d="M6 24 q7 -7 14 0 t14 0" stroke="#F2EDE3" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M6 31 q7 -7 14 0 t14 0" stroke="#F2EDE3" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".55"/></svg>
  파랑서가
</div>
</body></html>
