<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1B2350"/>
      <stop offset="0.55" stop-color="#2B2F6E"/>
      <stop offset="1" stop-color="#5A4A8C"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="440" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9B4F0" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#8F88D8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8F88D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6DD"/>
      <stop offset="1" stop-color="#F3D9A4"/>
    </linearGradient>
    <mask id="cres">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="520" cy="440" r="210" fill="white"/>
      <circle cx="616" cy="378" r="184" fill="black"/>
    </mask>
    <clipPath id="sq"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="440" r="380" fill="url(#halo)"/>
    <!-- breath rings -->
    <circle cx="512" cy="440" r="290" fill="none" stroke="#C9C4F5" stroke-opacity="0.16" stroke-width="10"/>
    <circle cx="512" cy="440" r="360" fill="none" stroke="#C9C4F5" stroke-opacity="0.08" stroke-width="8"/>
    <rect width="1024" height="1024" fill="url(#moon)" mask="url(#cres)"/>
    <!-- calm water lines -->
    <g stroke="#E9E3FF" stroke-linecap="round" fill="none">
      <path d="M262 770 C 350 738, 426 738, 512 770 S 676 802, 762 770" stroke-width="26" stroke-opacity="0.85"/>
      <path d="M352 852 C 410 832, 456 832, 512 852 S 614 872, 672 852" stroke-width="20" stroke-opacity="0.45"/>
    </g>
    <circle cx="760" cy="250" r="16" fill="#FFF6DD"/>
  </g>
</svg>
